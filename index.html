<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>One League | Predict & Win</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        /* الخلفية المتحركة بالأسود والأزرق والتموجات */
        body {
            background: radial-gradient(circle at center, #0a192f 0%, #020617 100%);
            background-size: 400% 400%;
            animation: gradientMove 15s ease infinite;
            color: white;
            font-family: 'Segoe UI', sans-serif;
            min-height: 100vh;
        }

        @keyframes gradientMove {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        /* شاشة الترحيب */
        #splashScreen {
            position: fixed;
            inset: 0;
            background: radial-gradient(circle at center, #0a192f 0%, #020617 100%);
            z-index: 9999;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            transition: opacity 0.5s ease, visibility 0.5s ease;
        }

        /* تصميم الحرف الافتراضي */
        .splash-letter {
            display: inline-block;
            opacity: 0;
            transform: translateY(-40px);
            transition: all 0.4s cubic-bezier(0.16, 1, 0.3, 1);
        }

        /* تصميم الزجاج العصري (Glassmorphism) */
        .glass {
            background: rgba(15, 23, 42, 0.7);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(56, 189, 248, 0.2);
        }
    </style>
</head>
<body class="p-4 md:p-8">

    <!-- شاشة الترحيب (Splash Screen) -->
    <div id="splashScreen">
        <div class="text-center space-y-3">
            <h1 id="splashTitle" class="text-5xl md:text-6xl font-black text-transparent bg-clip-text bg-gradient-to-r from-sky-400 to-blue-600 tracking-wider"></h1>
            <p id="splashSubtitle" class="text-slate-400 text-xs md:text-sm tracking-widest uppercase opacity-0 transition-opacity duration-300">
                Predict the matches, climb the global rank.
            </p>
        </div>
    </div>

    <!-- محتوى الموقع الأساسي -->
    <div class="max-w-3xl mx-auto space-y-6">
        
        <!-- العنوان الرئيسي داخل الموقع -->
        <div class="text-center py-6">
            <h1 onclick="location.reload()" class="cursor-pointer inline-block text-4xl font-black text-transparent bg-clip-text bg-gradient-to-r from-sky-400 to-blue-600 tracking-wider hover:opacity-80 transition select-none" title="Click to Refresh">
                One League
            </h1>
            <p class="text-slate-400 text-xs mt-1">Predict the matches, climb the global rank.</p>
        </div>

        <!-- خانة ID اللاعب -->
        <section class="glass p-5 rounded-2xl shadow-2xl">
            <label class="block text-xs uppercase tracking-widest text-sky-400 font-semibold mb-2">Player Identity</label>
            <div class="flex gap-2">
                <input type="text" id="currentUserId" placeholder="Enter your ID..." 
                    class="w-full bg-slate-950/60 border border-slate-700/60 rounded-xl px-4 py-3 focus:border-sky-400 outline-none transition text-white font-bold">
                <button id="saveIdBtn" class="bg-sky-500 hover:bg-sky-600 text-slate-950 px-6 py-3 rounded-xl font-bold transition shadow-lg shadow-sky-500/20">Save</button>
            </div>
        </section>

        <!-- قسم المباريات -->
        <section class="space-y-4">
            <h2 class="text-lg font-bold text-sky-400 flex items-center gap-2">⚽ Upcoming Matches</h2>
            <div id="matchesContainer" class="grid gap-4"></div>
        </section>

        <!-- جدول الترتيب القابل للطي (Accordion) -->
        <details class="glass p-4 rounded-2xl shadow-2xl cursor-pointer group">
            <summary class="font-bold text-sky-400 flex justify-between items-center select-none outline-none">
                <span>🏆 Global Leaderboard & Rankings</span>
                <span class="text-xs text-slate-400 group-open:rotate-180 transition">▼ Click to open</span>
            </summary>
            
            <div class="mt-4 pt-3 border-t border-slate-800 space-y-4">
                <div id="myRankCard" class="bg-gradient-to-r from-sky-900/50 to-blue-900/50 border border-sky-400/40 p-4 rounded-xl flex items-center justify-between shadow-lg"></div>
                <div id="leaderboardContainer"></div>
            </div>
        </details>

    </div>

    <!-- سكربت التشغيل المباشر -->
    <script>
        (function() {
            const titleText = "One League";
            const titleContainer = document.getElementById('splashTitle');
            const subtitle = document.getElementById('splashSubtitle');
            const splashScreen = document.getElementById('splashScreen');
            
            const letterSpans = [];

            // توليد الحروف مباشرة
            for (let i = 0; i < titleText.length; i++) {
                const span = document.createElement('span');
                span.textContent = titleText[i] === ' ' ? '\u00A0' : titleText[i];
                span.className = 'splash-letter';
                titleContainer.appendChild(span);
                letterSpans.push(span);
            }

            // إظهار الحروف وهبوطها واحد ورا خوه
            window.addEventListener('load', () => {
                letterSpans.forEach((span, index) => {
                    setTimeout(() => {
                        span.style.opacity = '1';
                        span.style.transform = 'translateY(0)';
                    }, index * 70);
                });

                setTimeout(() => {
                    subtitle.style.opacity = '1';
                }, 400);

                // اختفاء الحروف وتراجعها للتحت واحد ورا خوه بعد ثانيتين
                setTimeout(() => {
                    letterSpans.forEach((span, index) => {
                        setTimeout(() => {
                            span.style.opacity = '0';
                            span.style.transform = 'translateY(30px)';
                        }, index * 50);
                    });
                    subtitle.style.opacity = '0';

                    setTimeout(() => {
                        splashScreen.style.opacity = '0';
                        splashScreen.style.visibility = 'hidden';
                    }, 500);

                }, 2000);
            });
        })();
    </script>

    <!-- استدعاء ملف الـ JS -->
    <script type="module" src="app.js"></script>
</body>
</html>
