<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OneLeague | Predict & Win</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        /* الخلفية المتحركة */
        body {
            background: linear-gradient(-45deg, #0f172a, #1e293b, #020617, #0f172a);
            background-size: 400% 400%;
            animation: gradient 15s ease infinite;
            font-family: 'Inter', sans-serif;
        }
        @keyframes gradient {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }
        .glass { background: rgba(15, 23, 42, 0.7); backdrop-filter: blur(10px); }
    </style>
</head>
<body class="text-slate-100 min-h-screen p-4 md:p-8">

    <div class="max-w-4xl mx-auto space-y-8">
        
        <header class="text-center space-y-2 animate-fade-in">
            <h1 class="text-5xl font-black text-transparent bg-clip-text bg-gradient-to-r from-emerald-400 to-cyan-400">
                ONELEAGUE
            </h1>
            <p class="text-slate-400">Predict the future, climb the leaderboard.</p>
        </header>

        <!-- User ID Section -->
        <section class="glass p-6 rounded-3xl border border-slate-700/50 shadow-2xl">
            <label class="block text-xs uppercase tracking-widest text-slate-500 mb-2">Player Tag</label>
            <div class="flex gap-2">
                <input type="text" id="currentUserId" placeholder="Enter your ID" 
                    class="w-full bg-slate-950/50 border border-slate-700 rounded-2xl px-4 py-3 focus:border-emerald-500 outline-none transition">
                <button id="saveIdBtn" class="bg-emerald-500 hover:bg-emerald-600 text-slate-950 px-6 py-3 rounded-2xl font-bold transition">Save</button>
            </div>
        </section>

        <!-- Matches -->
        <section class="space-y-4">
            <h2 class="text-xl font-bold text-emerald-400">Upcoming Matches</h2>
            <div id="matchesContainer" class="grid gap-4"></div>
        </section>

        <!-- Leaderboard -->
        <section class="glass p-6 rounded-3xl border border-slate-700/50 shadow-2xl">
            <h2 class="text-xl font-bold text-emerald-400 mb-4">Global Rankings</h2>
            <table class="w-full text-left">
                <thead><tr class="text-slate-500 text-xs uppercase">
                    <th class="py-3">#</th>
                    <th class="py-3">Player</th>
                    <th class="py-3 text-right">Points</th>
                </tr></thead>
                <tbody id="leaderboardTable" class="divide-y divide-slate-800"></tbody>
            </table>
        </section>
    </div>

    <script type="module" src="app.js"></script>
</body>
</html>
