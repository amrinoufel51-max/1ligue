<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>One League | Predict & Win</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        /* الخلفية المتحركة */
        body {
            background: radial-gradient(circle at center, #0a192f 0%, #020617 100%);
            background-size: 400% 400%;
            animation: gradientMove 15s ease infinite;
            color: white;
            font-family: 'Segoe UI', sans-serif;
            min-height: 100vh;
        }

        @keyframes gradientMove {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        /* شاشة الترحيب تختفي بمجرد ما يكملو الحروف يهبطو */
        #splashScreen {
            position: fixed;
            inset: 0;
            background: radial-gradient(circle at center, #0a192f 0%, #020617 100%);
            z-index: 9999;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            animation: hideSplash 0.4s ease 1.5s forwards;
        }

        @keyframes hideSplash {
            to {
                opacity: 0;
                visibility: hidden;
            }
        }

        /* أنيميشن الهبوط وثبات الحرف مع إظهار التدرج اللوني بوضوح */
        .splash-title span {
            display: inline-block;
            opacity: 0;
            transform: translateY(-40px);
            background: linear-gradient(to right, #38bdf8, #2563eb);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            animation: dropIn 0.6s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }

        /* تأخير زمني لكل حرف باش يهبطو بالترتيب */
        .splash-title span:nth-child(1) { animation-delay: 0.05s; }
        .splash-title span:nth-child(2) { animation-delay: 0.1s; }
        .splash-title span:nth-child(3) { animation-delay: 0.15s; }
        .splash-title span:nth-child(4) { animation-delay: 0.2s; } /* المسافة */
        .splash-title span:nth-child(5) { animation-delay: 0.25s; }
        .splash-title span:nth-child(6) { animation-delay: 0.3s; }
        .splash-title span:nth-child(7) { animation-delay: 0.35s; }
        .splash-title span:nth-child(8) { animation-delay: 0.4s; }
        .splash-title span:nth-child(9) { animation-delay: 0.45s; }
        .splash-title span:nth-child(10) { animation-delay: 0.5s; }

        @keyframes dropIn {
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .splash-sub {
            opacity: 0;
            animation: fadeIn 0.6s ease forwards;
            animation-delay: 0.5s;
        }

        @keyframes fadeIn {
            to { opacity: 1; }
        }

        /* تصميم الزجاج العصري */
        .glass {
            background: rgba(15, 23, 42, 0.7);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(56, 189, 248, 0.2);
        }
    </style>
</head>
<body class="p-4 md:p-8">

    <!-- شاشة الترحيب بالحروف الهابطة والثابتة -->
    <div id="splashScreen">
        <div class="text-center space-y-3">
            <h1 class="splash-title text-5xl md:text-6xl font-black tracking-wider flex justify-center">
                <span>O</span><span>n</span><span>e</span><span>&nbsp;</span><span>L</span><span>e</span><span>a</span><span>g</span><span>u</span><span>e</span>
            </h1>
            <p class="splash-sub text-slate-400 text-xs md:text-sm tracking-widest uppercase">
                Predict the matches, climb the global rank.
            </p>
        </div>
    </div>

    <!-- محتوى الموقع الأساسي -->
    <div class="max-w-3xl mx-auto space-y-6">
        
        <!-- العنوان الرئيسي داخل الموقع -->
        <div class="text-center py-6">
            <h1 onclick="location.reload()" class="cursor-pointer inline-block text-4xl font-black text-transparent bg-clip-text bg-gradient-to-r from-sky-400 to-blue-600 tracking-wider hover:opacity-80 transition select-none" title="Click to Refresh">
                One League
            </h1>
            <p class="text-slate-400 text-xs mt-1">Predict the matches, climb the global rank.</p>
        </div>

        <!-- خانة ID اللاعب ومعلومات الاتصال -->
        <section class="glass p-5 rounded-2xl shadow-2xl space-y-3">
            <div>
                <label class="block text-xs uppercase tracking-widest text-sky-400 font-semibold mb-1">Player Identity (Unique ID)</label>
                <input type="text" id="currentUserId" placeholder="Enter your unique ID..." 
                    class="w-full bg-slate-950/60 border border-slate-700/60 rounded-xl px-4 py-3 focus:border-sky-400 outline-none transition text-white font-bold">
            </div>

            <div>
                <label class="block text-xs uppercase tracking-widest text-sky-400 font-semibold mb-1">Contact (Phone or Email - For Prizes)</label>
                <input type="text" id="userContact" placeholder="Enter WhatsApp number or Email..." 
                    class="w-full bg-slate-950/60 border border-slate-700/60 rounded-xl px-4 py-3 focus:border-sky-400 outline-none transition text-white text-sm">
            </div>

            <button id="saveIdBtn" class="w-full bg-sky-500 hover:bg-sky-600 text-slate-950 py-3 rounded-xl font-bold transition shadow-lg shadow-sky-500/20">Save Identity & Contact 💾</button>
        </section>

        <!-- قسم المباريات -->
        <section class="space-y-4">
            <h2 class="text-lg font-bold text-sky-400 flex items-center gap-2">⚽ Upcoming Matches</h2>
            <div id="matchesContainer" class="grid gap-4"></div>
        </section>

        <!-- جدول الترتيب القابل للطي -->
        <details class="glass p-4 rounded-2xl shadow-2xl cursor-pointer group">
            <summary class="font-bold text-sky-400 flex justify-between items-center select-none outline-none">
                <span>🏆 Global Leaderboard & Rankings</span>
                <span class="text-xs text-slate-400 group-open:rotate-180 transition">▼ Click to open</span>
            </summary>
            
            <div class="mt-4 pt-3 border-t border-slate-800 space-y-4">
                <div id="myRankCard" class="bg-gradient-to-r from-sky-900/50 to-blue-900/50 border border-sky-400/40 p-4 rounded-xl flex items-center justify-between shadow-lg"></div>
                <div id="leaderboardContainer"></div>
            </div>
        </details>

    </div>

    <!-- استدعاء ملف الـ JS -->
    <script type="module" src="app.js"></script>
</body>
</html>
