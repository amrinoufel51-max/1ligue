<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OneLeague | Predict & Win</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        /* الخلفية المتحركة بالأسود والأزرق والتموجات */
        body {
            background: radial-gradient(circle at center, #0a192f 0%, #020617 100%);
            background-size: 400% 400%;
            animation: gradientMove 15s ease infinite;
            color: white;
            font-family: 'Segoe UI', sans-serif;
            min-height: 100vh;
        }

        @keyframes gradientMove {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        /* أنيميشن نزول العنوان من الفوق للتحت */
        .reveal-text {
            animation: dropDown 1.2s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }

        @keyframes dropDown {
            from { opacity: 0; transform: translateY(-60px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* تصميم الزجاج العصري (Glassmorphism) */
        .glass {
            background: rgba(15, 23, 42, 0.7);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(56, 189, 248, 0.2);
        }
    </style>
</head>
<body class="p-4 md:p-8">

    <div class="max-w-3xl mx-auto space-y-6">
        
        <!-- العنوان مع الأنيميشن -->
        <div class="reveal-text text-center py-6">
            <h1 class="text-5xl font-black text-transparent bg-clip-text bg-gradient-to-r from-sky-400 to-blue-600 tracking-wider">
                ONELEAGUE
            </h1>
            <p class="text-slate-400 text-sm mt-1">Predict the matches, climb the global rank.</p>
        </div>

        <!-- خانة ID اللاعب -->
        <section class="glass p-5 rounded-2xl shadow-2xl">
            <label class="block text-xs uppercase tracking-widest text-sky-400 font-semibold mb-2">Player Identity</label>
            <div class="flex gap-2">
                <input type="text" id="currentUserId" placeholder="Enter your ID..." 
                    class="w-full bg-slate-950/60 border border-slate-700/60 rounded-xl px-4 py-3 focus:border-sky-400 outline-none transition text-white font-bold">
                <button id="saveIdBtn" class="bg-sky-500 hover:bg-sky-600 text-slate-950 px-6 py-3 rounded-xl font-bold transition shadow-lg shadow-sky-500/20">Save</button>
            </div>
        </section>

        <!-- قسم المباريات -->
        <section class="space-y-4">
            <h2 class="text-lg font-bold text-sky-400 flex items-center gap-2">⚽ Upcoming Matches</h2>
            <div id="matchesContainer" class="grid gap-4"></div>
        </section>

        <!-- جدول الترتيب القابل للطي (Accordion) -->
        <details class="glass p-4 rounded-2xl shadow-2xl cursor-pointer group">
            <summary class="font-bold text-sky-400 flex justify-between items-center select-none outline-none">
                <span>🏆 Global Leaderboard & Rankings</span>
                <span class="text-xs text-slate-400 group-open:rotate-180 transition">▼ Click to open</span>
            </summary>
            <div id="leaderboardContainer" class="mt-4 pt-3 border-t border-slate-800">
                <!-- سيتم ملؤه تلقائياً بـ JavaScript -->
            </div>
        </details>

    </div>

    <!-- استدعاء ملف الـ JS -->
    <script type="module" src="app.js"></script>
</body>
</html>
